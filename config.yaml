# 会议助手配置 —— 改完重启 run.py 生效

server:
  host: 0.0.0.0          # 0.0.0.0 才能让同一 Wi-Fi 下的手机访问
  port: 8765

audio:
  enabled: true
  mic_device: null              # null = 系统默认麦克风；也可填设备名的一部分，如 "MacBook"
  system_device: "BlackHole"    # 采集会议里对方声音的虚拟声卡（设备名的一部分即可）；填 null 则只录麦克风
  end_silence_ms: 700           # 静音多久算一句话结束
  max_utterance_s: 15           # 单句最长，超过强制切分
  min_utterance_s: 0.4          # 太短的片段丢弃（咳嗽、杂音）

asr:
  backend: mlx                  # mlx（Apple 芯片推荐） | faster-whisper
  model: mlx-community/whisper-large-v3-turbo
  # faster-whisper 时可用：large-v3-turbo / large-v3 / medium
  language: null                # null = 自动识别，适合中英混合
  initial_prompt: "以下是一段中英文混合的会议对话，包含 product、roadmap、API、KPI 等英文术语。"

speakers:
  enabled: true                 # 对方声道内再细分不同说话人（需要 resemblyzer）
  threshold: 0.72               # 相似度阈值，越高越容易被分成新的人
  max_speakers: 6

intent:
  # 判断"对方是不是在向我提问"用哪个模型：
  #   claude  默认，会顺便把问题改写完整
  #   jev     TypeSafe AI 的 Jev 决策模型（填好下面 jev 配置后可用）
  #   compare 以 claude 为准，同时调用 jev，结果和耗时写入 logs/intent_compare.jsonl 方便对比
  #   rules   只用规则，不调用任何模型
  provider: claude
  answer_for: others            # others = 只回答对方的问题；all = 包括自己
  settle_ms: 1200               # 对方停顿多久后再判断（防止一个问题被切成几段）
  context_lines: 8              # 判断时参考最近几句话
  jev:
    url: ""                     # Jev 的 API 地址（拿到文档后填写）；也可用环境变量 JEV_API_URL
    api_key_env: JEV_API_KEY    # API Key 放在这个环境变量里
    model: jev
    threshold: 0.6              # "是问题"概率超过多少才回答
    timeout_s: 3

llm:
  provider: anthropic           # 需要环境变量 ANTHROPIC_API_KEY
  fast_model: claude-haiku-5-5  # 用于判断是否是问题（要快）
  answer_model: claude-sonnet-5-5   # 用于生成回答
  max_answer_tokens: 600

kb:
  dir: knowledge                # 资料库文件夹：放 .md .txt .pdf .docx
  embed_model: BAAI/bge-m3      # 多语言向量模型，支持中文问题搜英文资料；首次运行会自动下载约 2GB
  chunk_chars: 500
  chunk_overlap: 100
  top_k: 5
