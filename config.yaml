# 会议助手配置 —— 改完重启 run.py 生效

server:
  host: 0.0.0.0          # 0.0.0.0 才能让同一 Wi-Fi 下的手机访问
  port: 8765

audio:
  enabled: true
  mic_device: null              # null = 系统默认麦克风；也可填设备名的一部分，如 "MacBook"
  system_device: "BlackHole"    # 采集会议里对方声音的虚拟声卡（设备名的一部分即可）；线下会议填 null
  auto_stop_minutes: 10         # 点了「开始」后，连续多少分钟没人说话就自动结束（避免忘了点结束浪费时长）；0 = 不自动结束

asr:
  provider: soniox              # 实时语音识别 API：中英混说、实时区分说话人、自动断句
  api_key_env: SONIOX_API_KEY   # API Key 放在这个环境变量里（安装程序会写入 .env）
  model: stt-rt-v5
  language_hints: [zh, en]
  max_endpoint_delay_ms: 1500   # 一句话说完后最多等多久确认结束（500-3000）
  terms: []                     # 专有名词，能提高识别准确率，例如 [Kubernetes, 毛利率, ARR]
  context_text: ""              # 会议背景一句话，例如 "与客户讨论 SaaS 产品报价和上线计划"

speakers:
  enabled: true                 # 对方声道内区分不同说话人

intent:
  # 判断"对方是不是在向我提问"用哪种方式（页面「设置」里也可以改）：
  #   llm     用大模型（默认，会顺便把问题改写完整；用下面 llm.fast_provider 指定的模型）
  #   jev     用 Jev 决策模型（快、便宜，返回"是问题"的概率）
  #   compare 以大模型为准，同时调用 Jev，结果和耗时写入 logs/intent_compare.jsonl 方便对比
  #   rules   只用规则，不调用任何模型
  provider: llm
  answer_for: others            # others = 只回答对方的问题；all = 包括自己
  settle_ms: 1200               # 对方停顿多久后再判断（防止一个问题被切成几段）
  context_lines: 8              # 判断时参考最近几句话
  jev:
    url: https://jevmodel.org/v1/systemone   # 换成 TypeSafe 官方接口时只需改这里和 Key
    api_key_env: JEV_API_KEY
    model: jev-latest           # 调好阈值后建议固定版本，如 jev-1.13.0
    threshold: 0.6              # "是问题"概率超过多少才回答
    timeout_s: 3

llm:
  # 用哪个大模型根据资料回答问题：claude | openai（ChatGPT）| deepseek
  # 选中的模型出错或没填 Key 时，会自动换用其他已填 Key 的模型
  answer_provider: claude
  fast_provider: same           # 扩展检索词、判断提问用的模型；same = 和上面一样
  max_answer_tokens: 600
  providers:                    # 各家的模型名称（模型更新很快，可以在这里或页面「设置」里改）
    claude:
      fast_model: claude-haiku-5-5
      answer_model: claude-sonnet-5-5
    openai:
      base_url: https://api.openai.com/v1
      fast_model: gpt-5.4-mini
      answer_model: gpt-5.4-mini
    deepseek:
      base_url: https://api.deepseek.com
      fast_model: deepseek-flash
      answer_model: deepseek-flash
    # 其他兼容 OpenAI 格式的服务也可以加在这里，例如：
    # qwen:
    #   label: 通义千问
    #   key_env: QWEN_API_KEY
    #   base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    #   fast_model: qwen-plus
    #   answer_model: qwen-plus

kb:
  dir: knowledge                # 资料库文件夹：放 .md .txt .pdf .docx
  mode: auto                    # auto | full（全部资料交给 Claude，最准） | search（关键词检索，资料很多时用）
  full_max_chars: 150000        # auto 模式下，资料总字数不超过这个数就用 full
  chunk_chars: 500
  chunk_overlap: 100
  top_k: 6
